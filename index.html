<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover">

<title>Molesworth Maze: The Great Escape</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

/* =========================================================
   GAME SHELL
========================================================= */

#gameShell {
    position: relative;

    width: min(100vw, 500px);

    /*
       Keep the entire game inside one phone viewport.
    */
    height: min(100vh, 760px);

    display: flex;
    align-items: center;
    justify-content: center;

    background: #111;
}

#game {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #222;
}


/* =========================================================
   CANVAS
========================================================= */

canvas {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    display: block;
}


/* =========================================================
   TOP HUD
========================================================= */

#hud {
    position: absolute;

    top: env(safe-area-inset-top, 8px);
    left: 0;

    width: 100%;

    padding: 8px 10px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    z-index: 5;

    pointer-events: none;

    font-size: 13px;
    font-weight: bold;

    text-shadow:
        0 1px 2px #000;
}

.hudBox {
    background: rgba(0,0,0,.55);

    padding: 5px 8px;

    border-radius: 6px;

    white-space: nowrap;
}


/* =========================================================
   TITLE / GAME OVER SCREEN
========================================================= */

#titleScreen {
    position: absolute;

    inset: 0;

    z-index: 20;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 25px;

    text-align: center;

    background:
        linear-gradient(
            rgba(0,0,0,.55),
            rgba(0,0,0,.82)
        );
}

#titleScreen h1 {
    margin: 0;

    color: #ffcc00;

    font-size: clamp(27px, 7vw, 38px);

    line-height: 1.05;

    text-shadow:
        0 3px 8px #000;
}

#titleScreen h2 {
    margin: 8px 0 18px;

    color: #fff;

    font-size: 16px;

    font-weight: normal;
}

#titleScreen p {
    max-width: 360px;

    margin: 0 0 20px;

    color: #ddd;

    font-size: 14px;

    line-height: 1.5;
}

#playButton {

    border: 0;

    border-radius: 10px;

    padding: 14px 38px;

    background: #00529b;

    color: white;

    font-size: 20px;

    font-weight: bold;

    box-shadow:
        0 5px 0 #00345f;

    touch-action: manipulation;
}

#playButton:active {
    transform: translateY(4px);

    box-shadow:
        0 1px 0 #00345f;
}


/* =========================================================
   LEVEL MESSAGE
========================================================= */

#levelMessage {

    position: absolute;

    left: 50%;
    top: 42%;

    transform: translate(-50%, -50%);

    z-index: 10;

    width: 80%;

    padding: 16px;

    border-radius: 10px;

    background: rgba(0,0,0,.82);

    text-align: center;

    pointer-events: none;

    opacity: 0;

    transition: opacity .2s;
}

#levelMessage.show {
    opacity: 1;
}

#levelMessageTitle {

    color: #ffcc00;

    font-size: 28px;

    font-weight: bold;

}

#levelMessageText {

    margin-top: 6px;

    color: white;

    font-size: 14px;

}


/* =========================================================
   MOBILE CONTROLS
========================================================= */

#controls {

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;

    height: 135px;

    z-index: 8;

    /*
       Transparent enough that the player can still see
       the lower part of the road.
    */
    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.42)
        );

    pointer-events: none;
}


/*
   All buttons use pointer events.

   This is considerably more reliable than touchstart +
   setInterval for iPhone Safari.
*/

.control {

    position: absolute;

    width: 62px;
    height: 52px;

    border: 1px solid rgba(255,255,255,.25);

    border-radius: 13px;

    background:
        rgba(20,20,20,.78);

    color: white;

    font-size: 25px;

    display: flex;

    align-items: center;
    justify-content: center;

    box-shadow:
        0 4px 0 rgba(0,0,0,.8);

    pointer-events: auto;

    touch-action: none;

    user-select: none;
    -webkit-user-select: none;

    cursor: pointer;

    transition:
        transform .04s,
        background .04s;
}

.control.pressed {

    background: #0069b4;

    transform:
        translateY(3px);

    box-shadow:
        0 1px 0 rgba(0,0,0,.8);
}


/*
       D-pad layout
*/

#up {
    left: 50%;
    bottom: 73px;

    transform:
        translateX(-50%);
}

#down {
    left: 50%;
    bottom: 9px;

    transform:
        translateX(-50%);
}

#left {
    left: calc(50% - 105px);
    bottom: 41px;
}

#right {
    left: calc(50% + 43px);
    bottom: 41px;
}


/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 601px) {

    #gameShell {
        height: min(100vh, 760px);

        border-radius: 10px;

        box-shadow:
            0 10px 40px rgba(0,0,0,.7);
    }

    #controls {
        height: 115px;
    }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-height: 650px) {

    #controls {
        height: 105px;
    }

    .control {
        width: 55px;
        height: 46px;

        font-size: 21px;
    }

    #up {
        bottom: 58px;
    }

    #down {
        bottom: 5px;
    }

    #left {
        left: calc(50% - 93px);
        bottom: 31px;
    }

    #right {
        left: calc(50% + 38px);
        bottom: 31px;
    }

}

</style>
</head>


<body>

<div id="gameShell">

    <div id="game">

        <canvas
            id="canvas"
            width="500"
            height="760">
        </canvas>


        <!-- HUD -->

        <div id="hud">

            <div
                class="hudBox"
                id="lives">
                ❤️ ❤️ ❤️
            </div>

            <div
                class="hudBox"
                id="level">
                LEVEL 1 / 4
            </div>

            <div
                class="hudBox"
                id="status">
                READY
            </div>

        </div>


        <!-- LEVEL MESSAGE -->

        <div id="levelMessage">

            <div id="levelMessageTitle">
                LEVEL 1
            </div>

            <div id="levelMessageText">
                Reach Parliament
            </div>

        </div>


        <!-- CONTROLS -->

        <div id="controls">

            <button
                class="control"
                id="up"
                aria-label="Move up">
                ▲
            </button>

            <button
                class="control"
                id="left"
                aria-label="Move left">
                ◀
            </button>

            <button
                class="control"
                id="right"
                aria-label="Move right">
                ▶
            </button>

            <button
                class="control"
                id="down"
                aria-label="Move down">
                ▼
            </button>

        </div>


        <!-- TITLE SCREEN -->

        <div id="titleScreen">

            <h1>
                MOLESWORTH<br>
                MAZE
            </h1>

            <h2>
                The Great Escape
            </h2>

            <p id="titleDescription">
                Help Chris Luxon cross Molesworth Street
                and reach Parliament.
                <br><br>
                Four levels. Increasing traffic.
                Three lives.
            </p>

            <button id="playButton">
                PLAY
            </button>

        </div>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;


/* =========================================================
   UI
========================================================= */

const titleScreen =
    document.getElementById("titleScreen");

const playButton =
    document.getElementById("playButton");

const livesUI =
    document.getElementById("lives");

const levelUI =
    document.getElementById("level");

const statusUI =
    document.getElementById("status");

const levelMessage =
    document.getElementById("levelMessage");

const levelMessageTitle =
    document.getElementById("levelMessageTitle");

const levelMessageText =
    document.getElementById("levelMessageText");


/* =========================================================
   GAME CONSTANTS
========================================================= */


/*
   The screen is divided into horizontal lanes.

   IMPORTANT:

   The player can move freely vertically, like Frogger.

   These Y values are the centres of the different
   road / cycle lanes, not forced player positions.
*/

const START_Y = 690;

const PARLIAMENT_Y = 80;


/*
   Road layout:

       Parliament
       ----------------
       Cycle lane
       ----------------
       Traffic
       ----------------
       Traffic
       ----------------
       Cycle lane
       ----------------
       Apartments
*/


const LANES = [

    {
        top: 585,
        bottom: 635,
        type: "cycle",
        direction: 1
    },

    {
        top: 485,
        bottom: 585,
        type: "road",
        direction: -1
    },

    {
        top: 385,
        bottom: 485,
        type: "road",
        direction: 1
    },

    {
        top: 315,
        bottom: 365,
        type: "cycle",
        direction: -1
    }

];


/* =========================================================
   LEVEL SETTINGS
========================================================= */

const LEVELS = [

    {
        speed: 0.72,
        spawnRate: 0.010,
        maxObstacles: 7,
        groupChance: 0.18
    },

    {
        speed: 0.92,
        spawnRate: 0.014,
        maxObstacles: 9,
        groupChance: 0.30
    },

    {
        speed: 1.15,
        spawnRate: 0.019,
        maxObstacles: 11,
        groupChance: 0.48
    },

    {
        speed: 1.38,
        spawnRate: 0.024,
        maxObstacles: 14,
        groupChance: 0.65
    }

];


let currentLevel = 1;

let lives = 3;

let gameRunning = false;

let obstacles = [];

let animationFrame = null;

let levelTransition = false;

let transitionTimer = 0;


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: W / 2 - 18,

    y: START_Y,

    width: 36,

    height: 58,

    speed: 4.8,

    reset() {

        this.x =
            W / 2 -
            this.width / 2;

        this.y =
            START_Y;

    }

};


/* =========================================================
   INPUT
========================================================= */

const input = {

    up: false,

    down: false,

    left: false,

    right: false

};


/* =========================================================
   TOUCH / POINTER CONTROLS
========================================================= */

function bindButton(
    id,
    direction
) {

    const button =
        document.getElementById(id);


    function press(event) {

        event.preventDefault();

        input[direction] = true;

        button.classList.add(
            "pressed"
        );


        /*
           Pointer capture is important.

           Without it, if the user's finger moves a few
           pixels outside the button while holding it,
           Safari can stop delivering events.
        */

        try {

            button.setPointerCapture(
                event.pointerId
            );

        } catch (e) {}

    }


    function release(event) {

        event.preventDefault();

        input[direction] = false;

        button.classList.remove(
            "pressed"
        );

    }


    button.addEventListener(
        "pointerdown",
        press,
        {
            passive: false
        }
    );


    button.addEventListener(
        "pointerup",
        release,
        {
            passive: false
        }
    );


    button.addEventListener(
        "pointercancel",
        release,
        {
            passive: false
        }
    );


    button.addEventListener(
        "lostpointercapture",
        release
    );

}


bindButton(
    "up",
    "up"
);

bindButton(
    "down",
    "down"
);

bindButton(
    "left",
    "left"
);

bindButton(
    "right",
    "right"
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        if (!gameRunning) {
            return;
        }

        switch (
            event.key.toLowerCase()
        ) {

            case "arrowup":
            case "w":
                input.up = true;
                break;

            case "arrowdown":
            case "s":
                input.down = true;
                break;

            case "arrowleft":
            case "a":
                input.left = true;
                break;

            case "arrowright":
            case "d":
                input.right = true;
                break;

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        switch (
            event.key.toLowerCase()
        ) {

            case "arrowup":
            case "w":
                input.up = false;
                break;

            case "arrowdown":
            case "s":
                input.down = false;
                break;

            case "arrowleft":
            case "a":
                input.left = false;
                break;

            case "arrowright":
            case "d":
                input.right = false;
                break;

        }

    }
);


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer() {

    if (input.left) {

        player.x -=
            player.speed;

    }

    if (input.right) {

        player.x +=
            player.speed;

    }

    if (input.up) {

        player.y -=
            player.speed;

    }

    if (input.down) {

        player.y +=
            player.speed;

    }


    /*
       Keep player inside the screen.
    */

    player.x =
        Math.max(
            0,
            Math.min(
                W - player.width,
                player.x
            )
        );


    player.y =
        Math.max(
            45,
            Math.min(
                START_Y,
                player.y
            )
        );


    /*
       Reaching the Parliament area completes
       the current level.
    */

    if (
        player.y <
        PARLIAMENT_Y + 35
    ) {

        completeLevel();

    }

}


/* =========================================================
   OBSTACLE CLASS
========================================================= */

class Obstacle {

    constructor(
        lane,
        x,
        speed,
        direction,
        type,
        slogan = ""
    ) {

        this.lane =
            lane;

        this.x =
            x;

        this.speed =
            speed;

        this.direction =
            direction;

        this.type =
            type;

        this.slogan =
            slogan;


        if (
            type === "cyclist"
        ) {

            this.width = 30;
            this.height = 38;

        } else {

            this.width = 35;
            this.height = 55;

        }


        const laneData =
            LANES[lane];


        this.y =
            (
                laneData.top +
                laneData.bottom
            ) / 2 -
            this.height / 2;

    }


    update() {

        this.x +=
            this.speed *
            this.direction;

    }


    offScreen() {

        return (
            this.x <
                -100 ||
            this.x >
                W + 100
        );

    }


    hitbox() {

        /*
           Slightly smaller collision box than
           the artwork.

           This makes the game considerably less
           frustrating.
        */

        return {

            x:
                this.x + 5,

            y:
                this.y + 6,

            width:
                this.width - 10,

            height:
                this.height - 10

        };

    }


    draw() {

        if (
            this.type === "cyclist"
        ) {

            drawCyclist(
                this
            );

        } else {

            drawProtestor(
                this
            );

        }

    }

}


/* =========================================================
   PROTESTOR GROUPS
========================================================= */

const SLOGANS = [

    "FIX ROADS",
    "MORE BUSES",
    "SAVE WELLINGTON",
    "NO CUTS",
    "BIKE POWER",
    "STOP THIS"

];


/*
   This creates actual groups rather than isolated
   protesters.

   A group travels together with a small gap.
*/

function spawnProtestorGroup(
    lane
) {

    const settings =
        LEVELS[
            currentLevel - 1
        ];


    const count =
        2 +
        Math.floor(
            Math.random() * 3
        );


    const direction =
        LANES[lane].direction;


    const baseSpeed =
        1.5 *
        settings.speed;


    const startX =
        direction === 1
            ? -60
            : W + 60;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const spacing =
            48 * i;


        const x =
            direction === 1
                ? startX - spacing
                : startX + spacing;


        const slogan =
            SLOGANS[
                Math.floor(
                    Math.random() *
                    SLOGANS.length
                )
            ];


        obstacles.push(

            new Obstacle(
                lane,
                x,
                baseSpeed *
                    (
                        .9 +
                        Math.random() *
                        .15
                    ),
                direction,
                "protestor",
                slogan
            )

        );

    }

}


/* =========================================================
   SPAWN OBSTACLES
========================================================= */

function spawnObstacles() {

    if (
        levelTransition ||
        obstacles.length >=
        LEVELS[
            currentLevel - 1
        ].maxObstacles
    ) {

        return;

    }


    const settings =
        LEVELS[
            currentLevel - 1
        ];


    if (
        Math.random() >
        settings.spawnRate
    ) {

        return;

    }


    /*
       Pick one of the four dangerous lanes.
    */

    const lane =
        Math.floor(
            Math.random() *
            LANES.length
        );


    const direction =
        LANES[lane].direction;


    /*
       Protester groups become increasingly common.
    */

    if (
        Math.random() <
        settings.groupChance
    ) {

        spawnProtestorGroup(
            lane
        );

        return;

    }


    /*
       Otherwise spawn a cyclist on cycle lanes
       or an individual protestor on roads.
    */

    const isCycleLane =
        LANES[lane].type ===
        "cycle";


    const speed =
        (
            isCycleLane
                ? 2.7
                : 1.45
        ) *
        settings.speed;


    const x =
        direction === 1
            ? -60
            : W + 60;


    const type =
        isCycleLane
            ? "cyclist"
            : "protestor";


    const slogan =
        SLOGANS[
            Math.floor(
                Math.random() *
                SLOGANS.length
            )
        ];


    obstacles.push(

        new Obstacle(
            lane,
            x,
            speed,
            direction,
            type,
            slogan
        )

    );

}


/* =========================================================
   COLLISION
========================================================= */

function overlap(
    a,
    b
) {

    return (

        a.x <
            b.x + b.width &&

        a.x + a.width >
            b.x &&

        a.y <
            b.y + b.height &&

        a.y + a.height >
            b.y

    );

}


function playerHitbox() {

    return {

        x:
            player.x + 8,

        y:
            player.y + 8,

        width:
            player.width - 16,

        height:
            player.height - 14

    };

}


function checkCollisions() {

    const p =
        playerHitbox();


    for (
        const obstacle
        of obstacles
    ) {

        /*
           Only collision-check if the player is
           actually vertically overlapping the obstacle.
        */

        if (
            overlap(
                p,
                obstacle.hitbox()
            )
        ) {

            hitPlayer();

            return;

        }

    }

}


/* =========================================================
   PLAYER HIT
========================================================= */

function hitPlayer() {

    lives--;

    updateHUD();


    /*
       Clear the current traffic so the player isn't
       immediately hit again.
    */

    obstacles = [];


    player.reset();


    statusUI.textContent =
        "WATCH THE TRAFFIC";


    if (
        lives <= 0
    ) {

        gameOver();

    }

}


/* =========================================================
   LEVEL COMPLETE
========================================================= */

function completeLevel() {

    if (
        levelTransition ||
        !gameRunning
    ) {

        return;

    }


    levelTransition = true;

    obstacles = [];


    /*
       Last level = game won.
    */

    if (
        currentLevel >= 4
    ) {

        gameWon();

        return;

    }


    /*
       Move to next level.
    */

    currentLevel++;


    updateHUD();


    levelMessageTitle.textContent =
        `LEVEL ${currentLevel}`;

    levelMessageText.textContent =
        "Traffic is getting faster.";


    levelMessage.classList.add(
        "show"
    );


    transitionTimer = 100;

}


/* =========================================================
   TRANSITION
========================================================= */

function updateTransition() {

    if (
        !levelTransition
    ) {

        return;

    }


    transitionTimer--;


    if (
        transitionTimer <= 0
    ) {

        levelTransition =
            false;


        levelMessage.classList.remove(
            "show"
        );


        player.reset();

        statusUI.textContent =
            "CROSS THE ROAD";

    }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    let hearts = "";

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        hearts +=
            i < lives
                ? "❤️ "
                : "🖤 ";

    }


    livesUI.textContent =
        hearts;


    levelUI.textContent =
        `LEVEL ${currentLevel} / 4`;

}


/* =========================================================
   DRAW BACKGROUND
========================================================= */

function drawBackground() {

    /*
       Apartments
    */

    ctx.fillStyle =
        "#07528c";

    ctx.fillRect(
        0,
        635,
        W,
        125
    );


    drawApartments();


    /*
       Cycle lane 1
    */

    drawCycleLane(
        LANES[0]
    );


    /*
       Traffic 1
    */

    drawRoad(
        LANES[1]
    );


    /*
       Traffic 2
    */

    drawRoad(
        LANES[2]
    );


    /*
       Cycle lane 2
    */

    drawCycleLane(
        LANES[3]
    );


    /*
       Parliament
    */

    drawParliament();


    /*
       Lane boundaries
    */

    ctx.strokeStyle =
        "rgba(255,255,255,.25)";

    ctx.lineWidth = 2;


    for (
        const lane
        of LANES
    ) {

        ctx.beginPath();

        ctx.moveTo(
            0,
            lane.top
        );

        ctx.lineTo(
            W,
            lane.top
        );

        ctx.stroke();

    }

}


/* =========================================================
   APARTMENTS
========================================================= */

function drawApartments() {

    ctx.fillStyle =
        "#174d75";


    ctx.fillRect(
        15,
        655,
        110,
        90
    );


    ctx.fillRect(
        375,
        665,
        110,
        80
    );


    ctx.fillStyle =
        "#ffd36a";


    for (
        let x = 30;
        x < 110;
        x += 28
    ) {

        for (
            let y = 670;
            y < 735;
            y += 25
        ) {

            ctx.fillRect(
                x,
                y,
                10,
                13
            );

        }

    }


    ctx.fillStyle =
        "rgba(255,255,255,.6)";

    ctx.font =
        "bold 12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "APARTMENTS",
        250,
        735
    );

}


/* =========================================================
   CYCLE LANE
========================================================= */

function drawCycleLane(
    lane
) {

    ctx.fillStyle =
        "#087f4d";


    ctx.fillRect(
        0,
        lane.top,
        W,
        lane.bottom -
        lane.top
    );


    ctx.fillStyle =
        "rgba(255,255,255,.7)";

    ctx.font =
        "18px Arial";

    ctx.textAlign =
        "center";


    for (
        let x = 45;
        x < W;
        x += 105
    ) {

        ctx.fillText(
            "🚲",
            x,
            lane.top + 34
        );

    }

}


/* =========================================================
   ROAD
========================================================= */

function drawRoad(
    lane
) {

    ctx.fillStyle =
        "#505050";


    ctx.fillRect(
        0,
        lane.top,
        W,
        lane.bottom -
        lane.top
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.35)";

    ctx.lineWidth = 2;

    ctx.setLineDash([
        22,
        16
    ]);


    ctx.beginPath();

    ctx.moveTo(
        0,
        (
            lane.top +
            lane.bottom
        ) / 2
    );

    ctx.lineTo(
        W,
        (
            lane.top +
            lane.bottom
        ) / 2
    );

    ctx.stroke();


    ctx.setLineDash([]);


    /*
       Direction arrows
    */

    ctx.fillStyle =
        "rgba(255,255,255,.22)";

    ctx.font =
        "18px Arial";

    ctx.textAlign =
        "center";


    const arrow =
        lane.direction === 1
            ? "→"
            : "←";


    for (
        let x = 50;
        x < W;
        x += 110
    ) {

        ctx.fillText(
            arrow,
            x,
            lane.bottom - 15
        );

    }

}


/* =========================================================
   NEW ZEALAND PARLIAMENT / BEEHIVE
========================================================= */

function drawParliament() {

    /*
       Background lawn.
    */

    ctx.fillStyle =
        "#e8f0ec";

    ctx.fillRect(
        0,
        0,
        W,
        315
    );


    /*
       Lawn / forecourt.
    */

    ctx.fillStyle =
        "#78956c";

    ctx.fillRect(
        0,
        265,
        W,
        50
    );


    /*
       Parliament building.

       The Beehive is represented by its distinctive
       circular / stepped form, rather than a rectangle.
    */

    ctx.save();

    ctx.translate(
        W / 2,
        155
    );


    /*
       Main lower stepped body.
    */

    ctx.fillStyle =
        "#9da6a5";

    ctx.beginPath();

    ctx.moveTo(
        -95,
        105
    );

    ctx.lineTo(
        -70,
        65
    );

    ctx.lineTo(
        -55,
        25
    );

    ctx.lineTo(
        -40,
        -15
    );

    ctx.lineTo(
        40,
        -15
    );

    ctx.lineTo(
        55,
        25
    );

    ctx.lineTo(
        70,
        65
    );

    ctx.lineTo(
        95,
        105
    );

    ctx.closePath();

    ctx.fill();


    /*
       Circular Beehive centre.
    */

    ctx.fillStyle =
        "#aeb6b5";

    ctx.beginPath();

    ctx.ellipse(
        0,
        -5,
        72,
        105,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Horizontal stepped rings.
    */

    ctx.strokeStyle =
        "rgba(65,75,75,.55)";

    ctx.lineWidth = 3;


    for (
        let y = -55;
        y <= 55;
        y += 20
    ) {

        const width =
            35 +
            Math.abs(y) * .35;


        ctx.beginPath();

        ctx.ellipse(
            0,
            y,
            width,
            8,
            0,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    /*
       Top dome.
    */

    ctx.fillStyle =
        "#8d9897";

    ctx.beginPath();

    ctx.arc(
        0,
        -87,
        27,
        Math.PI,
        0
    );

    ctx.fill();


    /*
       Flag pole.
    */

    ctx.strokeStyle =
        "#333";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        0,
        -113
    );

    ctx.lineTo(
        0,
        -145
    );

    ctx.stroke();


    /*
       New Zealand-style blue flag.
    */

    ctx.fillStyle =
        "#173c8c";

    ctx.fillRect(
        1,
        -144,
        22,
        13
    );


    /*
       Parliament entrance.
    */

    ctx.fillStyle =
        "#303838";

    ctx.fillRect(
        -28,
        62,
        56,
        43
    );


    ctx.fillStyle =
        "#ffcc00";

    ctx.font =
        "bold 9px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "PARLIAMENT",
        0,
        94
    );


    ctx.restore();


    /*
       Label.
    */

    ctx.fillStyle =
        "#333";

    ctx.font =
        "bold 12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        "PARLIAMENTARY PRECINCT",
        W / 2,
        290
    );

}


/* =========================================================
   CYCLIST DRAWING
========================================================= */

function drawCyclist(
    o
) {

    /*
       Wheels
    */

    ctx.strokeStyle =
        "#151515";

    ctx.lineWidth = 3;


    ctx.beginPath();

    ctx.arc(
        o.x + 7,
        o.y + 31,
        7,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    ctx.beginPath();

    ctx.arc(
        o.x + 23,
        o.y + 31,
        7,
        0,
        Math.PI * 2
    );

    ctx.stroke();


    /*
       Bike frame
    */

    ctx.strokeStyle =
        "#111";

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.moveTo(
        o.x + 7,
        o.y + 31
    );

    ctx.lineTo(
        o.x + 14,
        o.y + 18
    );

    ctx.lineTo(
        o.x + 23,
        o.y + 31
    );

    ctx.lineTo(
        o.x + 7,
        o.y + 31
    );

    ctx.stroke();


    /*
       Rider
    */

    ctx.fillStyle =
        "#e33";

    ctx.fillRect(
        o.x + 9,
        o.y + 9,
        13,
        15
    );


    /*
       Head
    */

    ctx.fillStyle =
        "#ffd1aa";

    ctx.beginPath();

    ctx.arc(
        o.x + 15,
        o.y + 5,
        6,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Helmet
    */

    ctx.fillStyle =
        "#222";

    ctx.beginPath();

    ctx.arc(
        o.x + 15,
        o.y + 3,
        6,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================================
   PROTESTOR DRAWING
========================================================= */

function drawProtestor(
    o
) {

    /*
       Body
    */

    ctx.fillStyle =
        "#cc6818";

    ctx.fillRect(
        o.x + 5,
        o.y + 20,
        25,
        34
    );


    /*
       Head
    */

    ctx.fillStyle =
        "#ffd0a5";

    ctx.beginPath();

    ctx.arc(
        o.x + 17,
        o.y + 13,
        9,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Sign
    */

    const signX =
        o.x - 15;

    const signY =
        o.y - 13;


    ctx.fillStyle =
        "#fff";

    ctx.strokeStyle =
        "#222";

    ctx.lineWidth = 1;


    ctx.fillRect(
        signX,
        signY,
        65,
        20
    );

    ctx.strokeRect(
        signX,
        signY,
        65,
        20
    );


    /*
       Sign pole
    */

    ctx.fillStyle =
        "#634326";

    ctx.fillRect(
        o.x + 16,
        signY + 20,
        3,
        34
    );


    /*
       Slogan
    */

    ctx.fillStyle =
        "#111";

    ctx.font =
        "bold 7px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        o.slogan,
        signX + 32,
        signY + 13
    );

}


/* =========================================================
   LUXON
========================================================= */

function drawPlayer() {

    const cx =
        player.x +
        player.width / 2;


    /*
       Shadow
    */

    ctx.fillStyle =
        "rgba(0,0,0,.3)";

    ctx.beginPath();

    ctx.ellipse(
        cx,
        player.y +
            player.height -
            2,
        17,
        5,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       BODY
    */

    ctx.fillStyle =
        "#002f6c";

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y + 58
    );

    ctx.lineTo(
        player.x + 4,
        player.y + 25
    );

    ctx.lineTo(
        player.x + 32,
        player.y + 25
    );

    ctx.lineTo(
        player.x + 36,
        player.y + 58
    );

    ctx.closePath();

    ctx.fill();


    /*
       WHITE SHIRT
    */

    ctx.fillStyle =
        "#fff";

    ctx.beginPath();

    ctx.moveTo(
        cx - 6,
        player.y + 24
    );

    ctx.lineTo(
        cx,
        player.y + 33
    );

    ctx.lineTo(
        cx + 6,
        player.y + 24
    );

    ctx.closePath();

    ctx.fill();


    /*
       BLUE TIE
    */

    ctx.fillStyle =
        "#0099ff";

    ctx.fillRect(
        cx - 2,
        player.y + 31,
        4,
        14
    );


    /*
       COMICALLY LARGE BALD HEAD

       This is intentionally disproportionate.
    */

    ctx.fillStyle =
        "#ffd2ad";

    ctx.beginPath();

    ctx.ellipse(
        cx,
        player.y + 12,
        19,
        20,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Bare scalp highlight
    */

    ctx.fillStyle =
        "rgba(255,255,255,.32)";

    ctx.beginPath();

    ctx.ellipse(
        cx - 5,
        player.y + 5,
        7,
        5,
        -.3,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Ears
    */

    ctx.fillStyle =
        "#efb994";

    ctx.beginPath();

    ctx.arc(
        cx - 18,
        player.y + 13,
        4,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cx + 18,
        player.y + 13,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Eyes
    */

    ctx.fillStyle =
        "#222";

    ctx.beginPath();

    ctx.arc(
        cx - 7,
        player.y + 11,
        1.8,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cx + 7,
        player.y + 11,
        1.8,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
       Eyebrows
    */

    ctx.strokeStyle =
        "#777";

    ctx.lineWidth = 1.5;

    ctx.beginPath();

    ctx.moveTo(
        cx - 12,
        player.y + 7
    );

    ctx.lineTo(
        cx - 3,
        player.y + 6
    );

    ctx.moveTo(
        cx + 3,
        player.y + 6
    );

    ctx.lineTo(
        cx + 12,
        player.y + 7
    );

    ctx.stroke();


    /*
       Nose
    */

    ctx.strokeStyle =
        "#c58d70";

    ctx.beginPath();

    ctx.moveTo(
        cx,
        player.y + 11
    );

    ctx.lineTo(
        cx - 2,
        player.y + 18
    );

    ctx.lineTo(
        cx + 2,
        player.y + 18
    );

    ctx.stroke();


    /*
       Smile
    */

    ctx.beginPath();

    ctx.arc(
        cx,
        player.y + 18,
        6,
        0,
        Math.PI
    );

    ctx.stroke();

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

    gameRunning =
        false;


    titleScreen.style.display =
        "flex";


    document.querySelector(
        "#titleScreen h1"
    ).innerHTML =
        "MISSION<br>FAILED";


    document.querySelector(
        "#titleScreen h2"
    ).textContent =
        "The Molesworth Maze wins this round.";


    document.getElementById(
        "titleDescription"
    ).textContent =
        "You ran out of lives. Try again and make it through all four levels.";


    playButton.textContent =
        "TRY AGAIN";


    statusUI.textContent =
        "FAILED";


    if (
        animationFrame
    ) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame =
            null;

    }

}


/* =========================================================
   GAME WON
========================================================= */

function gameWon() {

    gameRunning =
        false;


    titleScreen.style.display =
        "flex";


    document.querySelector(
        "#titleScreen h1"
    ).innerHTML =
        "MISSION<br>ACCOMPLISHED";


    document.querySelector(
        "#titleScreen h2"
    ).textContent =
        "You've made it to Parliament!";


    document.getElementById(
        "titleDescription"
    ).textContent =
        "Chris Luxon successfully survived all four levels of the Molesworth Maze.";


    playButton.textContent =
        "PLAY AGAIN";


    statusUI.textContent =
        "COMPLETE";


    if (
        animationFrame
    ) {

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame =
            null;

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    currentLevel =
        1;

    lives =
        3;

    obstacles =
        [];

    levelTransition =
        false;

    transitionTimer =
        0;


    player.reset();


    updateHUD();


    statusUI.textContent =
        "CROSS THE ROAD";


    titleScreen.style.display =
        "none";


    levelMessage.classList.remove(
        "show"
    );


    gameRunning =
        true;


    gameLoop();

}


playButton.addEventListener(
    "click",
    startGame
);


/* =========================================================
   GAME LOOP
========================================================= */

function gameLoop() {

    if (
        !gameRunning
    ) {

        return;

    }


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();


    updateTransition();


    /*
       Don't allow movement during the short
       level transition.
    */

    if (
        !levelTransition
    ) {

        updatePlayer();

        spawnObstacles();

    }


    /*
       Obstacles
    */

    for (
        let i =
            obstacles.length - 1;

        i >= 0;

        i--
    ) {

        const obstacle =
            obstacles[i];


        obstacle.update();


        obstacle.draw();


        if (
            obstacle.offScreen()
        ) {

            obstacles.splice(
                i,
                1
            );

        }

    }


    drawPlayer();


    if (
        !levelTransition
    ) {

        checkCollisions();

    }


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================================================
   INITIAL SCREEN
========================================================= */

updateHUD();

player.reset();

drawBackground();

drawPlayer();

</script>
