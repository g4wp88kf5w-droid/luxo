<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>A vErY DiFfiCulT jOuRNey ACroSs MoLeswORth StrEet</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

#gameShell {
    width: min(100vw, 520px);
    height: 100vh;
    max-height: 900px;
    position: relative;
    background: #222;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #222;
    touch-action: none;
}

/* ---------------- TITLE / OVERLAYS ---------------- */

.overlay {
    position: absolute;
    inset: 0;
    z-index: 50;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    text-align: center;
    background:
        linear-gradient(
            rgba(0,0,0,0.86),
            rgba(0,0,0,0.93)
        );
    color: white;
}

.overlay.hidden {
    display: none;
}

.title {
    color: #ffcc00;
    font-size: clamp(25px, 7vw, 38px);
    line-height: 1.05;
    margin: 0 0 15px;
    font-weight: 900;
    text-transform: uppercase;
}

.subtitle {
    color: #ddd;
    font-size: 15px;
    line-height: 1.4;
    max-width: 390px;
    margin-bottom: 22px;
}

.levelText {
    color: #00e6ff;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 10px;
}

button {
    border: 0;
    border-radius: 9px;
    font-weight: 900;
    cursor: pointer;
    touch-action: manipulation;
}

#startButton {
    padding: 15px 34px;
    font-size: 19px;
    color: white;
    background: #075ca8;
    box-shadow: 0 5px 0 #03345f;
}

#startButton:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #03345f;
}

#gameUI {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    pointer-events: none;
    padding: 7px 10px;
}

#topBar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    font-size: 13px;
    font-weight: 900;
    text-shadow: 1px 1px 2px #000;
}

#levelDisplay {
    color: #ffcc00;
}

#statusDisplay {
    color: #fff;
}

#livesDisplay {
    letter-spacing: 1px;
}

/* ---------------- MOBILE CONTROLS ---------------- */

#controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 8px;
    z-index: 30;
    display: flex;
    justify-content: center;
    pointer-events: none;
}

#dpad {
    width: 154px;
    height: 154px;
    position: relative;
    pointer-events: auto;
}

.control {
    position: absolute;
    width: 52px;
    height: 52px;
    background: rgba(255,255,255,0.22);
    border: 2px solid rgba(255,255,255,0.5);
    color: white;
    font-size: 25px;
    border-radius: 12px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}

.control:active,
.control.pressed {
    background: rgba(255,204,0,0.7);
    color: #111;
}

#upBtn {
    top: 0;
    left: 51px;
}

#leftBtn {
    top: 51px;
    left: 0;
}

#rightBtn {
    top: 51px;
    right: 0;
}

#downBtn {
    bottom: 0;
    left: 51px;
}

/* ---------------- END SEQUENCE ---------------- */

#endingOverlay {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: #000;
    opacity: 0;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

#endingText {
    color: white;
    font-family: "Courier New", Courier, monospace;
    font-weight: 900;
    font-size: clamp(21px, 6vw, 32px);
    line-height: 1.35;
    text-align: center;
    opacity: 0;
    text-shadow: 0 0 3px white;
}

.cursor {
    display: inline-block;
    width: 9px;
    height: 1.1em;
    background: white;
    margin-left: 3px;
    vertical-align: -2px;
    animation: blink 0.8s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

/* ---------------- LEVEL COMPLETE ---------------- */

#levelOverlay {
    position: absolute;
    inset: 0;
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.72);
    color: white;
    text-align: center;
}

#levelOverlay.visible {
    display: flex;
}

#levelMessage {
    font-size: 28px;
    font-weight: 900;
    color: #ffcc00;
}

</style>
</head>

<body>

<div id="gameShell">

    <canvas id="gameCanvas"></canvas>

    <div id="gameUI">
        <div id="topBar">
            <div id="levelDisplay">LEVEL 1</div>
            <div id="statusDisplay">MAKE THE JOURNEY</div>
            <div id="livesDisplay">❤️ ❤️ ❤️</div>
        </div>
    </div>

    <div id="controls">
        <div id="dpad">
            <button class="control" id="upBtn">▲</button>
            <button class="control" id="leftBtn">◀</button>
            <button class="control" id="rightBtn">▶</button>
            <button class="control" id="downBtn">▼</button>
        </div>
    </div>

    <!-- TITLE SCREEN -->
    <div class="overlay" id="titleOverlay">

        <h1 class="title">
            A Very Difficult Journey<br>
            Across Molesworth Street
        </h1>

        <div class="subtitle">
            Help Christchurch Luxon make the very difficult journey
            to Parliament from his apartment.
        </div>

        <div class="levelText">
            LEVELS 1–4
        </div>

        <button id="startButton">
            START JOURNEY
        </button>

    </div>

    <!-- LEVEL TRANSITION -->
    <div id="levelOverlay">
        <div id="levelMessage"></div>
    </div>

    <!-- ENDING -->
    <div id="endingOverlay">
        <div id="endingText"></div>
    </div>

</div>

<script>

/* =========================================================
   SETUP
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const shell = document.getElementById("gameShell");

const titleOverlay = document.getElementById("titleOverlay");
const startButton = document.getElementById("startButton");

const levelDisplay = document.getElementById("levelDisplay");
const statusDisplay = document.getElementById("statusDisplay");
const livesDisplay = document.getElementById("livesDisplay");

const levelOverlay = document.getElementById("levelOverlay");
const levelMessage = document.getElementById("levelMessage");

const controls = {
    up: document.getElementById("upBtn"),
    down: document.getElementById("downBtn"),
    left: document.getElementById("leftBtn"),
    right: document.getElementById("rightBtn")
};

const endingOverlay = document.getElementById("endingOverlay");
const endingText = document.getElementById("endingText");


/* =========================================================
   CANVAS
========================================================= */

const W = 500;
const H = 760;

canvas.width = W;
canvas.height = H;


/* =========================================================
   GAME STATE
========================================================= */

let gameRunning = false;
let endingSequence = false;

let level = 1;
let lives = 3;

let animationId = null;

const keys = {
    up: false,
    down: false,
    left: false,
    right: false
};


/* =========================================================
   LEVEL CONFIGURATION
========================================================= */

const levels = {
    1: {
        speedMultiplier: 0.65,
        spawnMultiplier: 0.65,
        label: "LEVEL 1 — A GENTLE START"
    },

    2: {
        speedMultiplier: 0.9,
        spawnMultiplier: 0.9,
        label: "LEVEL 2 — TRAFFIC INCREASED"
    },

    3: {
        speedMultiplier: 1.15,
        spawnMultiplier: 1.2,
        label: "LEVEL 3 — THIS IS GETTING DIFFICULT"
    },

    4: {
        speedMultiplier: 1.45,
        spawnMultiplier: 1.55,
        label: "LEVEL 4 — VERY DIFFICULT"
    }
};


/* =========================================================
   ROAD LAYOUT
========================================================= */

const zones = {

    parliament: {
        y: 0,
        h: 170
    },

    cycle2: {
        y: 170,
        h: 60
    },

    road2: {
        y: 230,
        h: 105
    },

    road1: {
        y: 335,
        h: 105
    },

    cycle1: {
        y: 440,
        h: 60
    },

    apartment: {
        y: 500,
        h: 260
    }
};


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: W / 2 - 18,

    y: zones.apartment.y + 170,

    width: 36,
    height: 62,

    speed: 4.4,

    reset() {

        this.x = W / 2 - this.width / 2;
        this.y = zones.apartment.y + 170;

    }
};


/* =========================================================
   OBSTACLES
========================================================= */

let obstacles = [];

const protestorSlogans = [

    "FIX ROADS",
    "SAVE CITY",
    "NO CUTS",
    "MORE BUSES",
    "BIKE POWER",
    "SANCTIONS NOW!",
    "FIRE WINNIE",
    "SANCTIONS NOW!",
    "FIRE WINNIE"

];


/* =========================================================
   CYCLIST
========================================================= */

class Cyclist {

    constructor(y, speed, direction) {

        this.type = "cyclist";

        this.y = y + 14;

        this.width = 27;
        this.height = 34;

        this.speed = speed;
        this.direction = direction;

        this.x =
            direction === 1
            ? -60
            : W + 60;

        this.rotation = 0;

    }

    update() {

        this.x +=
            this.speed *
            this.direction *
            levels[level].speedMultiplier;

        this.rotation += 0.12;

    }

    draw() {

        ctx.save();

        ctx.translate(
            this.x + this.width / 2,
            this.y + this.height / 2
        );

        ctx.fillStyle = "#111";

        ctx.beginPath();
        ctx.arc(-8, 11, 8, 0, Math.PI * 2);
        ctx.arc(8, 11, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#111";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(-8, 11);
        ctx.lineTo(0, -2);
        ctx.lineTo(8, 11);
        ctx.moveTo(0, -2);
        ctx.lineTo(8, 0);
        ctx.stroke();

        ctx.fillStyle = "#e91e63";
        ctx.fillRect(-7, -14, 14, 15);

        ctx.fillStyle = "#ffd1a9";
        ctx.beginPath();
        ctx.arc(0, -20, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#222";
        ctx.beginPath();
        ctx.arc(0, -23, 7, Math.PI, Math.PI * 2);
        ctx.fill();

        ctx.restore();

    }
}


/* =========================================================
   PROTESTOR
========================================================= */

class Protestor {

    constructor(y, speed, direction, slogan) {

        this.type = "protestor";

        this.y = y + 10;

        this.width = 35;
        this.height = 48;

        this.speed = speed;
        this.direction = direction;

        this.slogan = slogan;

        this.x =
            direction === 1
            ? -80
            : W + 80;

        this.rotation = 0;

    }

    update() {

        this.x +=
            this.speed *
            this.direction *
            levels[level].speedMultiplier;

    }

    draw() {

        ctx.save();

        ctx.translate(
            this.x + this.width / 2,
            this.y + this.height / 2
        );

        /* body */

        ctx.fillStyle = "#d56a00";

        ctx.fillRect(
            -14,
            -3,
            28,
            28
        );

        /* head */

        ctx.fillStyle = "#ffd1a9";

        ctx.beginPath();
        ctx.arc(0, -13, 9, 0, Math.PI * 2);
        ctx.fill();

        /* hair */

        ctx.fillStyle = "#382010";

        ctx.beginPath();
        ctx.arc(0, -17, 9, Math.PI, Math.PI * 2);
        ctx.fill();

        /* sign */

        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 2;

        ctx.fillRect(
            -27,
            -42,
            54,
            18
        );

        ctx.strokeRect(
            -27,
            -42,
            54,
            18
        );

        ctx.fillStyle = "#111";
        ctx.font = "bold 7px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
            this.slogan,
            0,
            -33
        );

        /* stick */

        ctx.fillStyle = "#633";

        ctx.fillRect(
            -1.5,
            -24,
            3,
            35
        );

        ctx.restore();

    }
}


/* =========================================================
   SCATTERED OBJECTS
========================================================= */

let debris = [];

class Debris {

    constructor(x, y, type) {

        this.x = x;
        this.y = y;

        this.type = type;

        this.vx =
            (Math.random() - 0.5) * 9;

        this.vy =
            -Math.random() * 8 - 3;

        this.gravity = 0.25;

        this.rotation =
            Math.random() * Math.PI;

        this.rotationSpeed =
            (Math.random() - 0.5) * 0.3;

        this.life = 180;

    }

    update() {

        this.x += this.vx;
        this.y += this.vy;

        this.vy += this.gravity;

        this.rotation += this.rotationSpeed;

        this.life--;

    }

    draw() {

        ctx.save();

        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        if (this.type === "bike") {

            ctx.strokeStyle = "#111";
            ctx.lineWidth = 4;

            ctx.beginPath();
            ctx.arc(-8, 5, 8, 0, Math.PI * 2);
            ctx.arc(8, 5, 8, 0, Math.PI * 2);
            ctx.stroke();

        } else {

            ctx.fillStyle = "#d56a00";

            ctx.fillRect(
                -8,
                -8,
                16,
                16
            );

            ctx.fillStyle = "#ffd1a9";

            ctx.beginPath();
            ctx.arc(0, -12, 5, 0, Math.PI * 2);
            ctx.fill();

        }

        ctx.restore();

    }
}


/* =========================================================
   HELICOPTER
========================================================= */

const helicopter = {

    active: false,

    x: -180,

    y: 285,

    width: 150,

    height: 75,

    speed: 5.5,

    targetX: 270,

    boarded: false,

    cashTimer: 0,

    reset() {

        this.active = false;
        this.x = -180;
        this.y = 285;
        this.boarded = false;
        this.cashTimer = 0;

    },

    update() {

        if (!this.active) return;

        this.x += this.speed;

        if (!this.boarded &&
            this.x + this.width / 2 > player.x) {

            this.boarded = true;

            statusDisplay.textContent =
                "LUXON HAS FOUND A WAY OUT";

        }

        if (this.boarded) {

            player.x =
                this.x + 45;

            player.y =
                this.y + 20;

            this.cashTimer++;

            if (this.cashTimer % 4 === 0) {

                createCash();

            }

        }

    },

    draw() {

        if (!this.active) return;

        ctx.save();

        /* rotor */

        ctx.strokeStyle = "#222";
        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.moveTo(
            this.x + 25,
            this.y + 4
        );

        ctx.lineTo(
            this.x + 115,
            this.y + 4
        );

        ctx.stroke();

        /* tail */

        ctx.fillStyle = "#263238";

        ctx.beginPath();

        ctx.moveTo(
            this.x + 105,
            this.y + 30
        );

        ctx.lineTo(
            this.x + 150,
            this.y + 12
        );

        ctx.lineTo(
            this.x + 145,
            this.y + 42
        );

        ctx.closePath();

        ctx.fill();

        /* body */

        ctx.fillStyle = "#455a64";

        ctx.beginPath();

        ctx.ellipse(
            this.x + 65,
            this.y + 35,
            60,
            28,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        /* cockpit */

        ctx.fillStyle = "#b9e4f7";

        ctx.beginPath();

        ctx.ellipse(
            this.x + 90,
            this.y + 30,
            27,
            20,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        /* landing skids */

        ctx.strokeStyle = "#111";
        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.moveTo(
            this.x + 25,
            this.y + 60
        );

        ctx.lineTo(
            this.x + 100,
            this.y + 60
        );

        ctx.moveTo(
            this.x + 38,
            this.y + 50
        );

        ctx.lineTo(
            this.x + 30,
            this.y + 62
        );

        ctx.moveTo(
            this.x + 87,
            this.y + 50
        );

        ctx.lineTo(
            this.x + 95,
            this.y + 62
        );

        ctx.stroke();

        /* AIR FORCE */

        ctx.fillStyle = "#fff";
        ctx.font = "bold 10px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            "AIR FORCE",
            this.x + 55,
            this.y + 40
        );

        ctx.restore();

    }

};


/* =========================================================
   CASH
========================================================= */

let cash = [];

function createCash() {

    cash.push({

        x:
            helicopter.x +
            40 +
            Math.random() * 60,

        y:
            helicopter.y +
            60,

        vx:
            (Math.random() - 0.5) * 1.8,

        vy:
            1 + Math.random() * 2,

        rotation:
            Math.random() * 6.28,

        rotationSpeed:
            (Math.random() - 0.5) * 0.15,

        life: 220

    });

}

function updateCash() {

    for (let i = cash.length - 1; i >= 0; i--) {

        const c = cash[i];

        c.x += c.vx;
        c.y += c.vy;

        c.vy += 0.025;

        c.rotation += c.rotationSpeed;

        c.life--;

        if (c.life <= 0) {

            cash.splice(i, 1);

        }

    }

}

function drawCash() {

    for (const c of cash) {

        ctx.save();

        ctx.translate(c.x, c.y);
        ctx.rotate(c.rotation);

        ctx.fillStyle = "#70b85a";

        ctx.fillRect(
            -9,
            -5,
            18,
            10
        );

        ctx.strokeStyle = "#234";
        ctx.lineWidth = 1;

        ctx.strokeRect(
            -9,
            -5,
            18,
            10
        );

        ctx.fillStyle = "#245";

        ctx.font = "bold 7px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            "$",
            0,
            3
        );

        ctx.restore();

    }

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground() {

    /* apartment area */

    ctx.fillStyle = "#315a76";

    ctx.fillRect(
        0,
        zones.apartment.y,
        W,
        zones.apartment.h
    );

    drawApartment();

    /* cycle lane 1 */

    ctx.fillStyle = "#07864d";

    ctx.fillRect(
        0,
        zones.cycle1.y,
        W,
        zones.cycle1.h
    );

    drawCycleLane(zones.cycle1.y);

    /* roads */

    ctx.fillStyle = "#555";

    ctx.fillRect(
        0,
        zones.road1.y,
        W,
        zones.road1.h
    );

    ctx.fillStyle = "#484848";

    ctx.fillRect(
        0,
        zones.road2.y,
        W,
        zones.road2.h
    );

    drawRoadMarkings(zones.road1.y);
    drawRoadMarkings(zones.road2.y);

    /* cycle lane 2 */

    ctx.fillStyle = "#07864d";

    ctx.fillRect(
        0,
        zones.cycle2.y,
        W,
        zones.cycle2.h
    );

    drawCycleLane(zones.cycle2.y);

    /* parliament grass */

    ctx.fillStyle = "#5ca34d";

    ctx.fillRect(
        0,
        zones.parliament.y,
        W,
        zones.parliament.h
    );

    /* Beehive */

    drawBeehive();

}


/* =========================================================
   APARTMENT / CEO HOUSE
========================================================= */

function drawApartment() {

    /* building */

    ctx.fillStyle = "#d2d6d8";

    ctx.fillRect(
        100,
        525,
        300,
        210
    );

    /* windows */

    for (let y = 550; y < 710; y += 42) {

        for (let x = 120; x < 390; x += 42) {

            ctx.fillStyle = "#355c78";

            ctx.fillRect(
                x,
                y,
                25,
                23
            );

            ctx.strokeStyle = "#eee";
            ctx.lineWidth = 2;

            ctx.strokeRect(
                x,
                y,
                25,
                23
            );

        }

    }

    /* roof */

    ctx.fillStyle = "#444";

    ctx.fillRect(
        85,
        510,
        330,
        20
    );

    /* CEO HOUSE */

    ctx.fillStyle = "#111";

    ctx.fillRect(
        145,
        532,
        210,
        30
    );

    ctx.fillStyle = "#ffcc00";

    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "CEO HOUSE",
        250,
        554
    );

}


/* =========================================================
   BEEHIVE
========================================================= */

function drawBeehive() {

    const cx = 250;

    /* grass */

    ctx.fillStyle = "#4f9843";

    ctx.fillRect(
        0,
        0,
        W,
        155
    );

    /* building shadow */

    ctx.fillStyle = "#c7c7c7";

    ctx.beginPath();

    ctx.moveTo(95, 150);
    ctx.lineTo(405, 150);
    ctx.lineTo(385, 135);
    ctx.lineTo(115, 135);

    ctx.closePath();

    ctx.fill();

    /* lower columns */

    ctx.fillStyle = "#eee";

    for (let x = 115; x <= 385; x += 24) {

        ctx.fillRect(
            x,
            105,
            8,
            48
        );

    }

    /* main stepped tiers */

    const tiers = [
        {
            x: 100,
            y: 92,
            w: 300,
            h: 32
        },
        {
            x: 120,
            y: 67,
            w: 260,
            h: 28
        },
        {
            x: 140,
            y: 45,
            w: 220,
            h: 25
        },
        {
            x: 160,
            y: 27,
            w: 180,
            h: 22
        }
    ];

    for (const t of tiers) {

        ctx.fillStyle = "#d6d6d6";

        ctx.beginPath();

        ctx.ellipse(
            cx,
            t.y + t.h / 2,
            t.w / 2,
            t.h / 2,
            0,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.strokeStyle = "#999";
        ctx.lineWidth = 1;

        ctx.stroke();

        /* vertical windows */

        ctx.fillStyle = "#34576b";

        const count =
            Math.floor(t.w / 22);

        for (let i = 0; i < count; i++) {

            const wx =
                t.x + 10 + i * 22;

            ctx.fillRect(
                wx,
                t.y + 7,
                9,
                t.h - 12
            );

        }

    }

    /* top crown */

    ctx.fillStyle = "#bfc1c2";

    ctx.beginPath();

    ctx.ellipse(
        cx,
        28,
        90,
        22,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* dark vertical fins */

    ctx.fillStyle = "#555";

    for (let x = 165; x <= 335; x += 10) {

        ctx.fillRect(
            x,
            8,
            4,
            25
        );

    }

    /* central flag pole */

    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(250, 8);
    ctx.lineTo(250, -10);

    ctx.stroke();

    /* NZ flag */

    ctx.fillStyle = "#173b8f";

    ctx.fillRect(
        251,
        -9,
        34,
        18
    );

    /* flag red details */

    ctx.fillStyle = "#e52b2b";

    ctx.fillRect(
        270,
        -5,
        5,
        5
    );

    ctx.fillRect(
        263,
        1,
        5,
        5
    );

    /* entrance */

    ctx.fillStyle = "#222";

    ctx.fillRect(
        215,
        108,
        70,
        45
    );

    /* lawn foreground */

    ctx.fillStyle = "#56a447";

    ctx.fillRect(
        0,
        150,
        W,
        20
    );

}


/* =========================================================
   ROAD MARKINGS
========================================================= */

function drawRoadMarkings(y) {

    ctx.strokeStyle = "#eee";
    ctx.lineWidth = 3;
    ctx.setLineDash([28, 22]);

    ctx.beginPath();

    ctx.moveTo(
        0,
        y + 52
    );

    ctx.lineTo(
        W,
        y + 52
    );

    ctx.stroke();

    ctx.setLineDash([]);

}


/* =========================================================
   CYCLE LANE
========================================================= */

function drawCycleLane(y) {

    ctx.fillStyle = "#fff";

    ctx.font = "bold 12px Arial";
    ctx.textAlign = "center";

    for (let x = 40; x < W; x += 100) {

        ctx.fillText(
            "🚲",
            x,
            y + 37
        );

    }

}


/* =========================================================
   PLAYER
========================================================= */

function drawPlayer() {

    const cx =
        player.x +
        player.width / 2;

    /* body */

    ctx.fillStyle = "#063d78";

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y + player.height
    );

    ctx.lineTo(
        player.x + 5,
        player.y + 22
    );

    ctx.lineTo(
        player.x + player.width - 5,
        player.y + 22
    );

    ctx.lineTo(
        player.x + player.width,
        player.y + player.height
    );

    ctx.closePath();

    ctx.fill();

    /* enormous bald head */

    ctx.fillStyle = "#ffd1a9";

    ctx.beginPath();

    ctx.arc(
        cx,
        player.y + 9,
        17,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* tiny hair fringe */

    ctx.fillStyle = "#76502c";

    ctx.beginPath();

    ctx.arc(
        cx,
        player.y - 1,
        15,
        Math.PI,
        Math.PI * 2
    );

    ctx.fill();

    /* ears */

    ctx.fillStyle = "#e9af8a";

    ctx.beginPath();

    ctx.arc(
        cx - 16,
        player.y + 10,
        4,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cx + 16,
        player.y + 10,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* eyes */

    ctx.fillStyle = "#222";

    ctx.beginPath();

    ctx.arc(
        cx - 6,
        player.y + 7,
        1.7,
        0,
        Math.PI * 2
    );

    ctx.arc(
        cx + 6,
        player.y + 7,
        1.7,
        0,
        Math.PI * 2
    );

    ctx.fill();

    /* smile */

    ctx.strokeStyle = "#8a3f3f";
    ctx.lineWidth = 1.5;

    ctx.beginPath();

    ctx.arc(
        cx,
        player.y + 12,
        6,
        0,
        Math.PI
    );

    ctx.stroke();

    /* white shirt */

    ctx.fillStyle = "#fff";

    ctx.beginPath();

    ctx.moveTo(
        cx - 8,
        player.y + 23
    );

    ctx.lineTo(
        cx,
        player.y + 30
    );

    ctx.lineTo(
        cx + 8,
        player.y + 23
    );

    ctx.fill();

    /* blue tie */

    ctx.fillStyle = "#0099ff";

    ctx.fillRect(
        cx - 2,
        player.y + 28,
        4,
        22
    );

}


/* =========================================================
   INPUT
========================================================= */

window.addEventListener(
    "keydown",
    e => {

        const k =
            e.key.toLowerCase();

        if (k === "arrowup" || k === "w")
            keys.up = true;

        if (k === "arrowdown" || k === "s")
            keys.down = true;

        if (k === "arrowleft" || k === "a")
            keys.left = true;

        if (k === "arrowright" || k === "d")
            keys.right = true;

        if (
            [
                "arrowup",
                "arrowdown",
                "arrowleft",
                "arrowright",
                " "
            ].includes(k)
        ) {
            e.preventDefault();
        }

    },
    { passive: false }
);


window.addEventListener(
    "keyup",
    e => {

        const k =
            e.key.toLowerCase();

        if (k === "arrowup" || k === "w")
            keys.up = false;

        if (k === "arrowdown" || k === "s")
            keys.down = false;

        if (k === "arrowleft" || k === "a")
            keys.left = false;

        if (k === "arrowright" || k === "d")
            keys.right = false;

    }
);


/* Touch controls */

function bindControl(button, direction) {

    const press = e => {

        e.preventDefault();

        keys[direction] = true;

        button.classList.add("pressed");

    };

    const release = e => {

        e.preventDefault();

        keys[direction] = false;

        button.classList.remove("pressed");

    };

    button.addEventListener(
        "pointerdown",
        press
    );

    button.addEventListener(
        "pointerup",
        release
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        release
    );

}


bindControl(controls.up, "up");
bindControl(controls.down, "down");
bindControl(controls.left, "left");
bindControl(controls.right, "right");


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer() {

    if (endingSequence) return;

    let dx = 0;
    let dy = 0;

    if (keys.left) dx -= 1;
    if (keys.right) dx += 1;
    if (keys.up) dy -= 1;
    if (keys.down) dy += 1;

    /* diagonal movement normalisation */

    if (dx !== 0 && dy !== 0) {

        dx *= 0.707;
        dy *= 0.707;

    }

    player.x += dx * player.speed;
    player.y += dy * player.speed;

    /* boundaries */

    player.x = Math.max(
        0,
        Math.min(
            W - player.width,
            player.x
        )
    );

    player.y = Math.max(
        zones.parliament.y + 5,
        Math.min(
            H - player.height,
            player.y
        )
    );

}


/* =========================================================
   SPAWNING
========================================================= */

let spawnCounter = 0;

function spawnObstacles() {

    if (endingSequence) return;

    spawnCounter++;

    const multiplier =
        levels[level].spawnMultiplier;

    /* cycle lane 1 */

    if (
        Math.random() <
        0.018 * multiplier
    ) {

        obstacles.push(
            new Cyclist(
                zones.cycle1.y,
                2.7,
                1
            )
        );

    }

    /* cycle lane 2 */

    if (
        Math.random() <
        0.022 * multiplier
    ) {

        obstacles.push(
            new Cyclist(
                zones.cycle2.y,
                3.0,
                -1
            )
        );

    }

    /* protestor group */

    if (
        Math.random() <
        0.018 * multiplier
    ) {

        spawnProtestorGroup(
            zones.road1.y,
            -1
        );

    }

    if (
        Math.random() <
        0.016 * multiplier
    ) {

        spawnProtestorGroup(
            zones.road2.y,
            1
        );

    }

}


/* =========================================================
   PROTESTOR GROUPS
========================================================= */

function spawnProtestorGroup(y, direction) {

    const groupSize =
        level === 1
        ? 2
        : level === 2
        ? 3
        : level === 3
        ? 4
        : 5;

    const speed =
        0.8 +
        Math.random() * 0.6;

    for (let i = 0; i < groupSize; i++) {

        const slogan =
            protestorSlogans[
                Math.floor(
                    Math.random() *
                    protestorSlogans.length
                )
            ];

        const p =
            new Protestor(
                y,
                speed +
                Math.random() * 0.35,
                direction,
                slogan
            );

        p.x =
            direction === 1
            ? -70 - i * 46
            : W + 70 + i * 46;

        obstacles.push(p);

    }

}


/* =========================================================
   COLLISIONS
========================================================= */

function collision(a, b) {

    return (

        a.x <
        b.x + b.width &&

        a.x + a.width >
        b.x &&

        a.y <
        b.y + b.height &&

        a.y + a.height >
        b.y

    );

}


function checkCollisions() {

    if (endingSequence) return;

    for (const o of obstacles) {

        if (collision(player, o)) {

            loseLife();

            return;

        }

    }

    /* reached Parliament */

    if (
        player.y <
        zones.parliament.y + 20
    ) {

        if (level < 4) {

            completeLevel();

        } else {

            triggerHelicopterSequence();

        }

    }

}


/* =========================================================
   LIVES
========================================================= */

function updateLives() {

    let text = "";

    for (let i = 0; i < 3; i++) {

        text +=
            i < lives
            ? "❤️ "
            : "🖤 ";

    }

    livesDisplay.textContent =
        text.trim();

}


function loseLife() {

    lives--;

    updateLives();

    obstacles = [];

    player.reset();

    statusDisplay.textContent =
        "BLOCKED — TRY AGAIN";

    if (lives <= 0) {

        gameOver();

    }

}


/* =========================================================
   LEVEL PROGRESSION
========================================================= */

function completeLevel() {

    gameRunning = false;

    obstacles = [];

    const nextLevel =
        level + 1;

    levelOverlay.classList.add(
        "visible"
    );

    levelMessage.innerHTML =
        `
        LEVEL ${level} COMPLETE
        <br>
        <span style="
        font-size:16px;
        color:white;
        ">
        The journey gets harder...
        </span>
        `;

    setTimeout(() => {

        level = nextLevel;

        levelDisplay.textContent =
            "LEVEL " + level;

        player.reset();

        statusDisplay.textContent =
            levels[level].label;

        levelOverlay.classList.remove(
            "visible"
        );

        gameRunning = true;

        gameLoop();

    }, 1700);

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver() {

    gameRunning = false;

    titleOverlay.classList.remove(
        "hidden"
    );

    startButton.textContent =
        "TRY AGAIN";

    statusDisplay.textContent =
        "MISSION FAILED";

}


/* =========================================================
   HELICOPTER SEQUENCE
========================================================= */

function triggerHelicopterSequence() {

    if (endingSequence) return;

    endingSequence = true;
    gameRunning = false;

    keys.up =
    keys.down =
    keys.left =
    keys.right = false;

    statusDisplay.textContent =
        "UNEXPECTED ASSISTANCE ARRIVING";

    helicopter.reset();

    helicopter.active = true;

    helicopter.y =
        zones.road2.y + 5;

    helicopter.x = -180;

    /* freeze current obstacles briefly */

    setTimeout(() => {

        destroyObstaclesWithHelicopter();

    }, 700);

}


/* =========================================================
   HELICOPTER ATTACK / SCATTER
========================================================= */

function destroyObstaclesWithHelicopter() {

    const interval =
        setInterval(() => {

            if (
                !helicopter.active
            ) {

                clearInterval(interval);
                return;

            }

            const helicopterFront =
                helicopter.x + 15;

            for (
                let i = obstacles.length - 1;
                i >= 0;
                i--
            ) {

                const o =
                    obstacles[i];

                if (
                    o.x <
                    helicopterFront + 50 &&
                    o.x + o.width >
                    helicopter.x - 10
                ) {

                    debris.push(
                        new Debris(
                            o.x +
                            o.width / 2,

                            o.y +
                            o.height / 2,

                            o.type === "cyclist"
                            ? "bike"
                            : "person"
                        )
                    );

                    if (
                        Math.random() <
                        0.7
                    ) {

                        debris.push(
                            new Debris(
                                o.x +
                                o.width / 2 +
                                10,

                                o.y +
                                o.height / 2,

                                o.type === "cyclist"
                                ? "bike"
                                : "person"
                            )
                        );

                    }

                    obstacles.splice(i, 1);

                }

            }

            if (
                helicopter.x >
                W + 100
            ) {

                clearInterval(interval);

                helicopter.boarded = true;

                startParliamentFlight();

            }

        }, 70);

}


/* =========================================================
   PARLIAMENT FLIGHT
========================================================= */

let flightStarted = false;

function startParliamentFlight() {

    if (flightStarted) return;

    flightStarted = true;

    statusDisplay.textContent =
        "EN ROUTE TO PARLIAMENT";

    /* helicopter now loops toward Parliament */

    helicopter.x =
        W + 180;

    helicopter.y =
        zones.road2.y;

    helicopter.speed =
        -4.5;

    const flight =
        setInterval(() => {

            helicopter.x +=
                helicopter.speed;

            helicopter.y -= 0.45;

            helicopter.cashTimer++;

            if (
                helicopter.cashTimer % 3 === 0
            ) {

                createCash();

            }

            if (
                helicopter.x <
                235
            ) {

                clearInterval(flight);

                helicopter.speed = 0;

                setTimeout(
                    beginFadeToBlack,
                    1200
                );

            }

        }, 30);

}


/* =========================================================
   FADE / FINAL QUOTE
========================================================= */

function beginFadeToBlack() {

    endingOverlay.style.opacity = "0";

    endingOverlay.style.transition =
        "opacity 3.5s ease";

    endingOverlay.style.pointerEvents =
        "auto";

    endingOverlay.offsetHeight;

    endingOverlay.style.opacity = "1";

    setTimeout(
        typeFinalQuote,
        3500
    );

}


function typeFinalQuote() {

    const quote =
        "''look, what I’d say to you is… vvrrrrrroooooommmm...''";

    endingText.innerHTML =
        '<span class="cursor"></span>';

    endingText.style.opacity = "1";

    const words =
        quote.split(" ");

    let index = 0;

    function nextWord() {

        if (index >= words.length) {

            const cursor =
                endingText.querySelector(
                    ".cursor"
                );

            if (cursor)
                cursor.remove();

            return;

        }

        const cursor =
            endingText.querySelector(
                ".cursor"
            );

        const word =
            words[index];

        const span =
            document.createElement("span");

        span.textContent =
            (index === 0 ? "" : " ") +
            word;

        endingText.insertBefore(
            span,
            cursor
        );

        index++;

        const delay =
            170 +
            Math.random() * 100;

        setTimeout(
            nextWord,
            delay
        );

    }

    nextWord();

}


/* =========================================================
   DRAW LOOP
========================================================= */

function updateDebris() {

    for (
        let i = debris.length - 1;
        i >= 0;
        i--
    ) {

        debris[i].update();

        if (
            debris[i].life <= 0
        ) {

            debris.splice(i, 1);

        }

    }

}


function drawDebris() {

    for (const d of debris) {

        d.draw();

    }

}


function updateObstacles() {

    if (endingSequence) return;

    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const o =
            obstacles[i];

        o.update();

        if (
            o.x < -120 ||
            o.x > W + 120
        ) {

            obstacles.splice(i, 1);

        }

    }

}


/* =========================================================
   MAIN GAME LOOP
========================================================= */

function gameLoop() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    drawBackground();

    if (!endingSequence) {

        updatePlayer();

        spawnObstacles();

        updateObstacles();

    }

    updateDebris();

    drawDebris();

    for (const o of obstacles) {

        o.draw();

    }

    if (
        !helicopter.active ||
        !helicopter.boarded
    ) {

        drawPlayer();

    } else {

        /* player rides inside helicopter */

        drawPlayer();

    }

    helicopter.update();

    helicopter.draw();

    updateCash();

    drawCash();

    if (!endingSequence) {

        checkCollisions();

    }

    if (
        gameRunning ||
        endingSequence
    ) {

        animationId =
            requestAnimationFrame(
                gameLoop
            );

    }

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    cancelAnimationFrame(
        animationId
    );

    level = 1;
    lives = 3;

    endingSequence = false;
    flightStarted = false;

    obstacles = [];
    debris = [];
    cash = [];

    helicopter.reset();

    helicopter.speed = 5.5;

    player.reset();

    updateLives();

    levelDisplay.textContent =
        "LEVEL 1";

    statusDisplay.textContent =
        "MAKE THE JOURNEY";

    endingOverlay.style.opacity =
        "0";

    endingOverlay.style.pointerEvents =
        "none";

    endingText.style.opacity =
        "0";

    titleOverlay.classList.add(
        "hidden"
    );

    gameRunning = true;

    gameLoop();

}


startButton.addEventListener(
    "click",
    startGame
);


/* =========================================================
   INITIAL DRAW
========================================================= */

player.reset();

updateLives();

drawBackground();
drawPlayer();

</script>
